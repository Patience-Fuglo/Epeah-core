[package]
name = "arbiter-shadow-engine"
version = "1.0.0"
edition = "2021"

[features]
default = []
enclave = ["tokio-vsock"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.10"
lazy_static = "1.4"
sha2 = "0.10"
serde_yaml = "0.9"
redis = { version = "0.24", features = ["tokio-comp"] }
tokio-vsock = { version = "0.5", optional = true }
