<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8C96B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0A0F1A"/>

  <text x="450" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4F1EC">Same trade, same engine code, different verdicts</text>
  <text x="450" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8C96B2">Identical proposal: BUY NIO, $30,000 — the Autonomy Envelope decides the outcome</text>

  <!-- Shared trade input -->
  <rect x="360" y="80" width="180" height="46" rx="8" fill="#151d33" stroke="#5B6480" stroke-width="0.5"/>
  <text x="450" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">BUY NIO · $30,000</text>
  <text x="450" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8C96B2">same trade, both agents</text>

  <line x1="380" y1="126" x2="230" y2="166" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="520" y1="126" x2="670" y2="166" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow3)"/>

  <!-- Left: conservative agent envelope -->
  <rect x="80" y="166" width="300" height="90" rx="8" fill="#151d33" stroke="#3B82F6" stroke-width="1"/>
  <text x="230" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">conservative_desk_agent</text>
  <text x="230" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">Autonomy Envelope:</text>
  <text x="230" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">max order value = $10,000</text>
  <text x="230" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">$30,000 exceeds this agent's cap</text>

  <!-- Right: systematic agent envelope -->
  <rect x="520" y="166" width="300" height="90" rx="8" fill="#151d33" stroke="#3B82F6" stroke-width="1"/>
  <text x="670" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">systematic_ev_desk_agent</text>
  <text x="670" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">Autonomy Envelope:</text>
  <text x="670" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">max order value = $100,000</text>
  <text x="670" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">$30,000 is well within this agent's cap</text>

  <line x1="230" y1="256" x2="230" y2="290" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="670" y1="256" x2="670" y2="290" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow3)"/>

  <!-- Outcomes -->
  <rect x="130" y="290" width="200" height="60" rx="8" fill="#2e1512" stroke="#D65C5C" stroke-width="1.5"/>
  <text x="230" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D65C5C">BLOCK</text>
  <text x="230" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">Exceeds this agent's envelope</text>

  <rect x="570" y="290" width="200" height="60" rx="8" fill="#0f2818" stroke="#3FA362" stroke-width="1.5"/>
  <text x="670" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3FA362">PASS</text>
  <text x="670" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">Within this agent's envelope</text>

  <text x="450" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5B6480">Verified by TestAutonomyEnvelope_PerAgentDifferentiation in main_test.go</text>
</svg>
