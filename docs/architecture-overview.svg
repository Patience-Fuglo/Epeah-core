<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8C96B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0A0F1A"/>

  <text x="450" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4F1EC">Epeah architecture: from agent identity to auditable evidence</text>

  <!-- Row 1: pipeline stages -->
  <g>
    <rect x="20" y="70" width="140" height="56" rx="8" fill="#151d33" stroke="#5B6480" stroke-width="0.5"/>
    <text x="90" y="93" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">Identity</text>
    <text x="90" y="111" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8C96B2">Which agent is this</text>
  </g>

  <line x1="160" y1="98" x2="196" y2="98" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="196" y="70" width="150" height="56" rx="8" fill="#151d33" stroke="#5B6480" stroke-width="0.5"/>
    <text x="271" y="93" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">Authorization</text>
    <text x="271" y="111" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8C96B2">Can it act at all</text>
  </g>

  <line x1="346" y1="98" x2="382" y2="98" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="382" y="60" width="220" height="76" rx="8" fill="#1a2340" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="492" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F4F1EC">Epeah Decision Control</text>
    <text x="492" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8C96B2">Should this specific</text>
    <text x="492" y="117" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8C96B2">action happen right now</text>
  </g>

  <line x1="602" y1="98" x2="638" y2="98" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="638" y="70" width="130" height="56" rx="8" fill="#151d33" stroke="#5B6480" stroke-width="0.5"/>
    <text x="703" y="93" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">Execution</text>
    <text x="703" y="111" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8C96B2">Broker / market</text>
  </g>

  <line x1="768" y1="98" x2="804" y2="98" stroke="#8C96B2" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="804" y="70" width="76" height="56" rx="8" fill="#151d33" stroke="#9b87f5" stroke-width="0.5"/>
    <text x="842" y="93" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">Evidence</text>
    <text x="842" y="111" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8C96B2">Hash chain</text>
  </g>

  <!-- Connector down to Decision Control detail -->
  <line x1="492" y1="136" x2="492" y2="180" stroke="#3B82F6" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Expanded Decision Control detail box -->
  <rect x="130" y="180" width="720" height="200" rx="12" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3B82F6">Inside Epeah Decision Control</text>

  <!-- Three rule checks -->
  <g>
    <rect x="155" y="222" width="200" height="60" rx="8" fill="#151d33" stroke="#5B6480" stroke-width="0.5"/>
    <text x="255" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">BannedAssetCheck</text>
    <text x="255" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">Restricted instruments</text>
    <text x="255" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B6480">Shipped</text>
  </g>

  <g>
    <rect x="370" y="222" width="200" height="60" rx="8" fill="#151d33" stroke="#5B6480" stroke-width="0.5"/>
    <text x="470" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">GraduatedSizeCheck</text>
    <text x="470" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">Per-trade value limits</text>
    <text x="470" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B6480">Shipped</text>
  </g>

  <g>
    <rect x="585" y="222" width="245" height="60" rx="8" fill="#1a2340" stroke="#D9942E" stroke-width="1"/>
    <text x="707" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">ConcentrationRiskCheck</text>
    <text x="707" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#D9942E">Sees "authorized, but unsafe"</text>
    <text x="707" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5B6480">Shipped — the Consequence Engine's first instance</text>
  </g>

  <!-- Autonomy envelope feeding thresholds -->
  <line x1="490" y1="282" x2="490" y2="310" stroke="#5B6480" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="330" y="310" width="320" height="52" rx="8" fill="#151d33" stroke="#3B82F6" stroke-width="1"/>
  <text x="490" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8ECF6">Autonomy Envelope (per agent)</text>
  <text x="490" y="349" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8C96B2">envelopes.json — thresholds every rule above reads from</text>

  <text x="490" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5B6480">Domain Risk Engine, Context Engine — roadmap, not yet built</text>
</svg>
