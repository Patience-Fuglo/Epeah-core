version: "3.8"

services:
  arbiter-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbiter_production_node
    restart: always
    environment:
      - ARBITER_ENV=DEV
      - ARBITER_REDIS_URL=redis://redis:6379
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID}
      - ALPACA_API_SECRET_KEY=${ALPACA_API_SECRET_KEY}
      - ARBITER_COMPLIANCE_TOKEN=${ARBITER_COMPLIANCE_TOKEN}
    ports:
      - "8080:8080"
    volumes:
      - /var/log/arbiter:/var/log/arbiter
    tmpfs:
      - /var/run/arbiter:rw,noexec,nosuid,size=64m
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: arbiter_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
